<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ange Orelien FOSSO | Full-Stack & AI</title>
    <!-- Montserrat Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000029; /* Votre fond */
            color: #FFFFFF; /* Votre texte principal */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: #09094E; /* Nouvelle couleur de la card (un ton au-dessus du fond) */
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #1E1E6B; /* Une bordure subtile pour donner de la profondeur */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #FFFFFF;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            font-weight: 400;
            color: #A0A0C0; /* Un gris-bleuté clair pour le texte secondaire (plus lisible) */
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            background: #ffffff; /* Un ton légèrement plus clair que la card pour le badge */
            color: #141459;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid #2B2BB0;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #003BFF; /* Votre bouton */
            color: #FFFFFF;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1A52FF; /* Une variante un peu plus lumineuse au survol */
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Ange Orelien FOSSO</h1>
    <div class="badge">Digital Sciences Engineer • Full-Stack Developer</div>
    <p>My full portfolio is currently under construction. In the meantime, feel free to check out my projects and follow my journey on my GitHub profile.</p>
    <a href="https://github.com/ange-astery" target="_blank" class="btn">View my GitHub</a>
</div>
</body>
</html>
